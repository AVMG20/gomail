name: Release

# Builds the desktop app for Linux, macOS and Windows and attaches the
# packages to the GitHub release. Push a version tag (git tag v1.0.0 && git
# push origin v1.0.0: the release is created with generated notes) or
# publish a release to run it, or start it manually for an existing tag.
#
# Optional repository secrets bake default OAuth client IDs into the build so
# end users don't have to create their own:
#   GOMAIL_GOOGLE_CLIENT_ID, GOMAIL_GOOGLE_CLIENT_SECRET, GOMAIL_MICROSOFT_CLIENT_ID

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-beta.33
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

# Publishing a release in the UI for a new tag also pushes the tag: the
# later run takes over.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Create release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Create the release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "${{ github.repository }}" --verify-tag --title "$TAG" --generate-notes \
              $([[ "$TAG" == *-* ]] && echo --prerelease) # v1.2.0-beta.1: not offered as an update

  build:
    name: Build (${{ matrix.name }})
    needs: release
    # Also when the release job was skipped (release published, or started by hand).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: macos-universal
            os: macos-latest
          - name: windows-amd64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libfuse2

      # windows-latest no longer ships NSIS, which the installer task needs.
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Compute build flags
        id: flags
        env:
          GOOGLE_ID: ${{ secrets.GOMAIL_GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.GOMAIL_GOOGLE_CLIENT_SECRET }}
          MS_ID: ${{ secrets.GOMAIL_MICROSOFT_CLIENT_ID }}
        run: |
          version="${TAG#v}"
          pkg="github.com/AVMG20/gomail/internal/auth"
          ldflags="-X main.version=${version}"
          [ -n "$GOOGLE_ID" ] && ldflags="$ldflags -X ${pkg}.DefaultGoogleClientID=${GOOGLE_ID}"
          [ -n "$GOOGLE_SECRET" ] && ldflags="$ldflags -X ${pkg}.DefaultGoogleClientSecret=${GOOGLE_SECRET}"
          [ -n "$MS_ID" ] && ldflags="$ldflags -X ${pkg}.DefaultMicrosoftClientID=${MS_ID}"
          echo "ldflags=$ldflags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Stamp the version into the platform metadata (Info.plist, .exe info, nfpm).
          sed -i.bak "s/^  version: .*/  version: \"${version}\"/" build/config.yml && rm build/config.yml.bak
          (cd build && wails3 update build-assets -name gomail -binaryname gomail -config config.yml -dir .)
          # update build-assets regenerates nfpm.yaml from the template; restore project metadata.
          sed -i.bak 's#^homepage: .*#homepage: "https://github.com/${{ github.repository }}"#' build/linux/nfpm/nfpm.yaml && rm build/linux/nfpm/nfpm.yaml.bak

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          GIT_COMMITTER_NAME: gomail
          GIT_COMMITTER_EMAIL: noreply@github.com
        run: |
          wails3 task linux:build "EXTRA_LDFLAGS=${{ steps.flags.outputs.ldflags }}"
          wails3 task linux:create:appimage "EXTRA_LDFLAGS=${{ steps.flags.outputs.ldflags }}"
          wails3 task linux:create:deb "EXTRA_LDFLAGS=${{ steps.flags.outputs.ldflags }}"
          wails3 task linux:create:rpm "EXTRA_LDFLAGS=${{ steps.flags.outputs.ldflags }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          wails3 task darwin:package:universal "EXTRA_LDFLAGS=${{ steps.flags.outputs.ldflags }}"
          wails3 task darwin:create:dmg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: wails3 task windows:package "EXTRA_LDFLAGS=${{ steps.flags.outputs.ldflags }}"

      - name: Collect release assets
        run: |
          mkdir -p dist
          name="gomail-${{ steps.flags.outputs.version }}-${{ matrix.name }}"
          ls -la bin
          case "${{ runner.os }}" in
            Linux)
              tar -C bin -czf "dist/${name}.tar.gz" gomail
              for f in bin/*.AppImage; do cp "$f" "dist/${name}.AppImage"; done
              for f in bin/*.deb; do cp "$f" "dist/${name}.deb"; done
              for f in bin/*.rpm; do cp "$f" "dist/${name}.rpm"; done
              ;;
            macOS)
              ditto -c -k --keepParent bin/gomail.app "dist/${name}.zip"
              for f in bin/*.dmg; do cp "$f" "dist/${name}.dmg"; done
              ;;
            Windows)
              cp bin/gomail.exe "dist/${name}-portable.exe"
              for f in bin/*installer*.exe; do cp "$f" "dist/${name}-setup.exe"; done
              ;;
          esac
          ls -la dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
