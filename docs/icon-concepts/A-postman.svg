<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EE3F0"/>
      <stop offset="1" stop-color="#5CC4DB"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2A6F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <!-- body -->
    <g filter="url(#soft)">
      <ellipse cx="512" cy="700" rx="300" ry="330" fill="url(#fur)" stroke="#2B7A8C" stroke-width="10"/>
      <!-- ears -->
      <circle cx="268" cy="430" r="58" fill="#7FD6E7" stroke="#2B7A8C" stroke-width="10"/>
      <circle cx="268" cy="430" r="26" fill="#F2B8B5"/>
      <circle cx="756" cy="420" r="58" fill="#7FD6E7" stroke="#2B7A8C" stroke-width="10"/>
      <circle cx="756" cy="420" r="26" fill="#F2B8B5"/>
    </g>

    <!-- goofy eyes (mismatched) -->
    <circle cx="410" cy="505" r="104" fill="#fff" stroke="#2B7A8C" stroke-width="10"/>
    <circle cx="628" cy="495" r="82" fill="#fff" stroke="#2B7A8C" stroke-width="10"/>
    <circle cx="446" cy="530" r="40" fill="#1F2937"/>
    <circle cx="460" cy="516" r="13" fill="#fff"/>
    <circle cx="602" cy="470" r="32" fill="#1F2937"/>
    <circle cx="612" cy="460" r="10" fill="#fff"/>

    <!-- muzzle, nose, teeth -->
    <ellipse cx="520" cy="640" rx="92" ry="62" fill="#F6E3C6" stroke="#2B7A8C" stroke-width="8"/>
    <ellipse cx="520" cy="610" rx="40" ry="26" fill="#5B3A29"/>
    <ellipse cx="508" cy="602" rx="12" ry="7" fill="#8B6450"/>
    <path d="M520 636 v22" stroke="#5B3A29" stroke-width="7" stroke-linecap="round"/>
    <rect x="490" y="660" width="28" height="44" rx="7" fill="#fff" stroke="#2B7A8C" stroke-width="6"/>
    <rect x="522" y="660" width="28" height="40" rx="7" fill="#fff" stroke="#2B7A8C" stroke-width="6"/>
    <!-- blush -->
    <ellipse cx="350" cy="640" rx="36" ry="20" fill="#FF7FA8" opacity="0.7"/>
    <ellipse cx="700" cy="630" rx="32" ry="18" fill="#FF7FA8" opacity="0.7"/>

    <!-- envelope held up -->
    <g transform="rotate(-9 512 810)" filter="url(#soft)">
      <rect x="352" y="730" width="320" height="200" rx="22" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="10"/>
      <path d="M362 742 L512 842 L662 742" fill="none" stroke="#1E3A8A" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- stamp -->
      <rect x="600" y="756" width="52" height="58" rx="6" fill="#EF4444" stroke="#B91C1C" stroke-width="5"/>
      <path d="M626 772 c-8-12 -24 -2 -14 10 l14 14 l14 -14 c10 -12 -6 -22 -14 -10z" fill="#fff"/>
    </g>
    <!-- paws gripping the envelope -->
    <ellipse cx="352" cy="828" rx="46" ry="38" fill="#F6E3C6" stroke="#2B7A8C" stroke-width="8"/>
    <ellipse cx="676" cy="790" rx="46" ry="38" fill="#F6E3C6" stroke="#2B7A8C" stroke-width="8"/>
  </g>

  <!-- postman cap, slightly askew -->
  <g transform="rotate(-12 512 330)" filter="url(#soft)">
    <path d="M330 360 C340 250 690 240 700 352 Z" fill="#1E3A8A" stroke="#0F1F4D" stroke-width="10" stroke-linejoin="round"/>
    <path d="M300 362 C420 400 640 398 760 356 C770 378 760 392 740 396 C610 430 420 432 300 396 C284 390 284 368 300 362 Z" fill="#172E6E" stroke="#0F1F4D" stroke-width="8"/>
    <!-- badge -->
    <rect x="478" y="292" width="72" height="48" rx="8" fill="#FBBF24" stroke="#B45309" stroke-width="5"/>
    <path d="M484 298 L514 320 L544 298" fill="none" stroke="#B45309" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
