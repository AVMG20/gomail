<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F87171"/><stop offset="1" stop-color="#DC2626"/></linearGradient>
    <clipPath id="c"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2A6F" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <g clip-path="url(#c)">
    <!-- post -->
    <rect x="470" y="760" width="84" height="260" fill="#7C4A2D" stroke="#4A2A18" stroke-width="10"/>
    <!-- mailbox body (back) -->
    <g filter="url(#s)">
      <path d="M200 520 a190 190 0 0 1 380 0 v260 h-380 z" fill="#B91C1C" stroke="#7F1D1D" stroke-width="12"/>
    </g>
    <!-- gopher head peeking from the opening -->
    <g>
      <circle cx="300" cy="300" r="48" fill="#7FD6E7" stroke="#2B7A8C" stroke-width="10"/>
      <circle cx="300" cy="300" r="22" fill="#F2B8B5"/>
      <circle cx="560" cy="290" r="48" fill="#7FD6E7" stroke="#2B7A8C" stroke-width="10"/>
      <circle cx="560" cy="290" r="22" fill="#F2B8B5"/>
      <ellipse cx="430" cy="430" rx="170" ry="160" fill="#86DDEB" stroke="#2B7A8C" stroke-width="10"/>
      <circle cx="372" cy="400" r="62" fill="#fff" stroke="#2B7A8C" stroke-width="9"/>
      <circle cx="500" cy="392" r="50" fill="#fff" stroke="#2B7A8C" stroke-width="9"/>
      <circle cx="390" cy="420" r="25" fill="#1F2937"/><circle cx="398" cy="411" r="8" fill="#fff"/>
      <circle cx="486" cy="378" r="20" fill="#1F2937"/><circle cx="492" cy="372" r="6" fill="#fff"/>
      <ellipse cx="438" cy="485" rx="58" ry="40" fill="#F6E3C6" stroke="#2B7A8C" stroke-width="7"/>
      <ellipse cx="438" cy="466" rx="24" ry="15" fill="#5B3A29"/>
      <rect x="420" y="496" width="17" height="26" rx="5" fill="#fff" stroke="#2B7A8C" stroke-width="5"/>
      <rect x="440" y="496" width="17" height="24" rx="5" fill="#fff" stroke="#2B7A8C" stroke-width="5"/>
    </g>
    <!-- letter in teeth -->
    <g transform="rotate(14 600 520)" filter="url(#s)">
      <rect x="470" y="470" width="230" height="146" rx="16" fill="#fff" stroke="#1E3A8A" stroke-width="9"/>
      <path d="M478 480 L585 556 L692 480" fill="none" stroke="#1E3A8A" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="640" y="490" width="40" height="44" rx="5" fill="#FBBF24" stroke="#B45309" stroke-width="4"/>
    </g>
    <!-- mailbox front lip/door (covers the gopher body) -->
    <g filter="url(#s)">
      <path d="M180 560 h420 v240 a20 20 0 0 1 -20 20 h-380 a20 20 0 0 1 -20 -20 z" fill="url(#box)" stroke="#7F1D1D" stroke-width="12"/>
      <rect x="250" y="640" width="280" height="40" rx="20" fill="#7F1D1D" opacity="0.35"/>
    </g>
    <!-- flag up -->
    <rect x="640" y="380" width="22" height="300" rx="8" fill="#374151" stroke="#111827" stroke-width="6"/>
    <path d="M662 390 h150 l-30 50 l30 50 h-150 z" fill="#FBBF24" stroke="#B45309" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
