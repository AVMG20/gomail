<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <clipPath id="c"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B2A6F" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <g clip-path="url(#c)">
    <!-- clouds -->
    <g fill="#fff" opacity="0.85">
      <ellipse cx="230" cy="250" rx="90" ry="40"/><ellipse cx="290" cy="225" rx="60" ry="45"/>
      <ellipse cx="790" cy="820" rx="110" ry="45"/><ellipse cx="730" cy="800" rx="60" ry="45"/>
    </g>
    <!-- speed lines -->
    <g stroke="#fff" stroke-width="16" stroke-linecap="round" opacity="0.7">
      <path d="M120 600 h120"/><path d="M150 660 h90"/><path d="M110 720 h130"/>
    </g>
    <g transform="rotate(-14 512 560)">
      <!-- gopher sitting on plane -->
      <g filter="url(#s)">
        <circle cx="430" cy="300" r="40" fill="#7FD6E7" stroke="#2B7A8C" stroke-width="10"/>
        <circle cx="600" cy="300" r="40" fill="#7FD6E7" stroke="#2B7A8C" stroke-width="10"/>
        <ellipse cx="515" cy="440" rx="160" ry="170" fill="#86DDEB" stroke="#2B7A8C" stroke-width="10"/>
        <!-- goggles -->
        <path d="M360 380 h310" stroke="#7C4A2D" stroke-width="22" stroke-linecap="round"/>
        <circle cx="460" cy="385" r="58" fill="#E0F2FE" stroke="#7C4A2D" stroke-width="16"/>
        <circle cx="575" cy="380" r="48" fill="#E0F2FE" stroke="#7C4A2D" stroke-width="16"/>
        <circle cx="478" cy="398" r="22" fill="#1F2937"/><circle cx="485" cy="390" r="7" fill="#fff"/>
        <circle cx="560" cy="368" r="18" fill="#1F2937"/><circle cx="566" cy="362" r="6" fill="#fff"/>
        <ellipse cx="518" cy="478" rx="54" ry="36" fill="#F6E3C6" stroke="#2B7A8C" stroke-width="7"/>
        <ellipse cx="518" cy="462" rx="22" ry="14" fill="#5B3A29"/>
        <rect x="501" y="490" width="16" height="24" rx="5" fill="#fff" stroke="#2B7A8C" stroke-width="5"/>
        <rect x="520" y="490" width="16" height="22" rx="5" fill="#fff" stroke="#2B7A8C" stroke-width="5"/>
        <!-- scarf -->
        <path d="M410 545 q105 40 210 0 v34 q-105 40 -210 0 z" fill="#EF4444" stroke="#991B1B" stroke-width="6"/>
        <path d="M410 560 q-70 -10 -120 30 q50 0 110 10 z" fill="#EF4444" stroke="#991B1B" stroke-width="6"/>
      </g>
      <!-- envelope plane -->
      <g filter="url(#s)">
        <path d="M230 600 L860 560 L300 760 Z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="12" stroke-linejoin="round"/>
        <path d="M300 760 L460 640 L860 560" fill="none" stroke="#1E3A8A" stroke-width="10" stroke-linejoin="round"/>
        <path d="M460 640 L420 700" stroke="#1E3A8A" stroke-width="10" stroke-linecap="round"/>
        <rect x="560" y="590" width="52" height="40" rx="6" fill="#EF4444" stroke="#B91C1C" stroke-width="5" transform="rotate(-6 586 610)"/>
      </g>
    </g>
  </g>
</svg>
