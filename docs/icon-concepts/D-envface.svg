<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BE7F2"/><stop offset="1" stop-color="#5CC4DB"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B2A6F" flood-opacity="0.4"/></filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <g filter="url(#s)">
    <!-- ears -->
    <circle cx="282" cy="318" r="62" fill="#7FD6E7" stroke="#2B7A8C" stroke-width="12"/>
    <circle cx="282" cy="318" r="28" fill="#F2B8B5"/>
    <circle cx="742" cy="318" r="62" fill="#7FD6E7" stroke="#2B7A8C" stroke-width="12"/>
    <circle cx="742" cy="318" r="28" fill="#F2B8B5"/>
    <!-- envelope body -->
    <rect x="212" y="330" width="600" height="440" rx="70" fill="url(#env)" stroke="#2B7A8C" stroke-width="14"/>
    <!-- flap -->
    <path d="M232 350 L512 560 L792 350" fill="none" stroke="#2B7A8C" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- eyes on the flap -->
  <circle cx="410" cy="470" r="72" fill="#fff" stroke="#2B7A8C" stroke-width="10"/>
  <circle cx="618" cy="462" r="58" fill="#fff" stroke="#2B7A8C" stroke-width="10"/>
  <circle cx="432" cy="492" r="30" fill="#1F2937"/><circle cx="442" cy="481" r="10" fill="#fff"/>
  <circle cx="600" cy="444" r="24" fill="#1F2937"/><circle cx="607" cy="437" r="8" fill="#fff"/>
  <!-- nose + buck teeth -->
  <ellipse cx="512" cy="600" rx="40" ry="26" fill="#5B3A29"/>
  <ellipse cx="500" cy="592" rx="12" ry="7" fill="#8B6450"/>
  <rect x="478" y="630" width="32" height="56" rx="9" fill="#fff" stroke="#2B7A8C" stroke-width="8"/>
  <rect x="514" y="630" width="32" height="50" rx="9" fill="#fff" stroke="#2B7A8C" stroke-width="8"/>
  <!-- blush -->
  <ellipse cx="320" cy="610" rx="40" ry="22" fill="#FF7FA8" opacity="0.7"/>
  <ellipse cx="704" cy="600" rx="36" ry="20" fill="#FF7FA8" opacity="0.7"/>
  <!-- stamp tongue-out sticker -->
  <g transform="rotate(10 740 700)">
    <rect x="692" y="650" width="96" height="104" rx="10" fill="#EF4444" stroke="#fff" stroke-width="10"/>
    <path d="M740 682 c-14 -20 -42 -4 -24 18 l24 24 l24 -24 c18 -22 -10 -38 -24 -18z" fill="#fff"/>
  </g>
</svg>
