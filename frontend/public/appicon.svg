<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8df7"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8efff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b2a7a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Tile (72px transparent margin so it sits well on macOS, Windows and Linux) -->
  <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#tile)"/>
  <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#sheen)"/>
  <rect x="73" y="73" width="878" height="878" rx="199" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- Envelope -->
  <g filter="url(#shadow)">
    <rect x="252" y="322" width="520" height="380" rx="56" fill="url(#paper)"/>
  </g>
  <path d="M286 372 L512 540 L738 372" fill="none" stroke="#2563eb" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
